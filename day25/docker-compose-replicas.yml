services:
  api:
    build:
      context:.
      dockerfile: Dockerfile.gpt2
    image: day25-vllm-gpt2:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "8000-8030:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
